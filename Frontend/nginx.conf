server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /admin/users/create -> /admin/users/create.html
    location ~ ^/admin/(users|assets|assignments|report|returns)/([^/]+)/?$ {
        try_files /admin/$1/$2.html /404.html;
    }

    # /admin/users -> /admin/users.html
    location ~ ^/admin/(users|assets|assignments|report|returns)/?$ {
        try_files /admin/$1.html /404.html;
    }

    # /admin, /staff, /test -> /admin.html, /staff.html, /test.html
    location ~ ^/(admin|staff|test)/?$ {
        try_files /$1.html /404.html;
    }

    # Everything else: serve the file if it exists, otherwise 404.html
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}