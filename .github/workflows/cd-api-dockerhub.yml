name: CD API Dockerhub
on:
    workflow_run:
        workflows:
            - Validation API
        types:
            - completed
jobs:
    docker:
        if: |
            github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.head_branch == 'deploy/dockerhub'

        runs-on: ubuntu-latest

        env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            IMAGE_NAME: nashassetmanagement/api

        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and Push
              uses: docker/build-push-action@v7
              with:
                  context: ./Backend/NashAssetManagement
                  file: ./Backend/NashAssetManagement/Dockerfile
                  push: true
                  tags: ${{ env.IMAGE_NAME }}:lastest
